filebeat.inputs:
  - type: filestream
    id: ca-server-jsonl
    enabled: true
    paths:
      - /logs/ca_server/*.jsonl
    parsers:
      - ndjson:
          target: ""
          add_error_key: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "ca-monitor-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.enabled: false

logging.level: info